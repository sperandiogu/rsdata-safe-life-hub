[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://sdk.mercadopago.com https://http2.mlstatic.com https://secure.mlstatic.com https://*.mlstatic.com; style-src 'self' 'unsafe-inline' https://http2.mlstatic.com https://secure.mlstatic.com https://*.mlstatic.com https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com https://http2.mlstatic.com https://secure.mlstatic.com https://*.mlstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://siwrumbueegavdiwzfnb.supabase.co https://api.mercadopago.com https://events.mercadopago.com https://sdk.mercadopago.com https://http2.mlstatic.com https://secure.mlstatic.com https://*.mlstatic.com https://*.mercadopago.com https://publica.cnpj.ws https://viacep.com.br https://hook.us2.make.com https://www.google-analytics.com https://analytics.google.com https://www.googletagmanager.com https://stats.g.doubleclick.net https://region1.google-analytics.com; frame-src 'self' https://www.googletagmanager.com https://sdk.mercadopago.com https://*.mercadopago.com https://*.mercadolibre.com https://*.mlstatic.com; object-src 'self'; base-uri 'self'; form-action 'self' https://*.mercadopago.com; frame-ancestors 'self'; upgrade-insecure-requests"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
